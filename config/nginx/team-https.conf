# Live values from ~/cn-team.env
# Backends published on Your Mac (UTM Emulated VLAN forwards).

upstream backends {
    server 10.7.12.104:3001 max_fails=1 fail_timeout=10s;
    server 10.7.12.104:3002 max_fails=1 fail_timeout=10s;
}

server {
    listen 8443 ssl http2;
    server_name app.localmesh.test api.localmesh.test;

    ssl_certificate certs/app.crt;
    ssl_certificate_key certs/app.key;

    location / {
        proxy_pass http://backends;
        proxy_next_upstream error timeout http_502;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
